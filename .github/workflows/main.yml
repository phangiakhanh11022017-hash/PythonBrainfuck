name: Build pybf
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install PyInstaller
      run: pip install pyinstaller
    - name: Build EXE
      run: pyinstaller --onefile run_bf.py
    - name: Upload EXE
      uses: actions/upload-artifact@v3
      with:
        name: pybf-exe
        path: dist/run_bf.exe
